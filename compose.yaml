services:
  registry:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      GITHUB_AUTH_MODE: app
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/miemie-github-app.pem
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_PATH: /data/registry.sqlite
      BACKUP_DIRECTORY: /backups
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - registry-data:/data
      - registry-backups:/backups
      - type: bind
        source: ${GITHUB_APP_PRIVATE_KEY_PATH:?Set the external private key path}
        target: /run/secrets/miemie-github-app.pem
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
volumes:
  registry-data:
  registry-backups:
